<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Bill Counter</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* मुख्य बॉक्स कंटेनर */
        .bill-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
            border: 1px solid #eef2f5;
            position: relative;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            font-size: 24px;
        }

        /* इनपुट ग्रुप स्टाइल */
        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        /* टोटल अमाउंट का बॉक्स */
        .total-box {
            background-color: #f8fafc;
            border: 1px dashed #cbd5e1;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-top: 25px;
            margin-bottom: 25px;
        }

        .total-label {
            font-size: 14px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .total-amount {
            font-size: 28px;
            font-weight: bold;
            color: #10b981;
            margin-top: 5px;
        }

        /* बटन लेआउट */
        .action-buttons {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        /* लेफ्ट साइड का बटन */
        .left-action-btn {
            background-color: #64748b;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .left-action-btn:hover {
            background-color: #475569;
        }

        /* मुख्य सेव बटन */
        .save-btn {
            flex-grow: 1;
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
        }

        .save-btn:hover {
            background-color: #4338ca;
        }
    </style>
</head>
<body>

    <div class="bill-card">
        <h2>🧾 New Bill Entry</h2>
        
        <!-- कस्टमर का नाम -->
        <div class="input-group">
            <label for="customerName">Customer Name</label>
            <input type="text" id="customerName" placeholder="Enter customer name">
        </div>

        <!-- आइटम का नाम -->
        <div class="input-group">
            <label for="itemName">Item Name</label>
            <input type="text" id="itemName" placeholder="Enter item name">
        </div>

        <!-- क्वांटिटी -->
        <div class="input-group">
            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" placeholder="0" min="0" oninput="calculateTotal()">
        </div>

        <!-- प्राइस -->
        <div class="input-group">
            <label for="price">Price per Item (₹)</label>
            <input type="number" id="price" placeholder="0.00" min="0" step="0.01" oninput="calculateTotal()">
        </div>

        <!-- टोटल अमाउंट बॉक्स -->
        <div class="total-box">
            <div class="total-label">Total Amount</div>
            <div class="total-amount" id="totalAmount">₹0.00</div>
        </div>

        <!-- बटन्स -->
        <div class="action-buttons">
            <!-- लेफ्ट साइड वाला बटन (यह अब दूसरे पेज पर ले जाएगा) -->
            <button class="left-action-btn" id="leftBtn" onclick="leftButtonAction()">View History</button>
            <!-- मुख्य सेव बटन -->
            <button class="save-btn" onclick="saveBill()">Save Bill</button>
        </div>
    </div>

    <script>
        // ऑटोमैटिक टोटल कैलकुलेट करने के लिए
        function calculateTotal() {
            const qty = parseFloat(document.getElementById('quantity').value) || 0;
            const price = parseFloat(document.getElementById('price').value) || 0;
            const total = qty * price;
            document.getElementById('totalAmount').innerText = '₹' + total.toFixed(2);
        }

        // डेटा सेव करने के लिए (Local Storage में)
        function saveBill() {
            const name = document.getElementById('customerName').value;
            const item = document.getElementById('itemName').value;
            const qty = document.getElementById('quantity').value;
            const price = document.getElementById('price').value;
            const total = qty * price;

            if(!name || !item || !qty || !price) {
                alert("कृपया सभी डिटेल्स भरें!");
                return;
            }

            const billData = {
                customerName: name,
                itemName: item,
                quantity: qty,
                price: price,
                totalAmount: total,
                date: new Date().toLocaleString()
            };

            // पहले से सेव डेटा निकालना या नया ऐरे बनाना
            let existingBills = JSON.parse(localStorage.getItem('allBills')) || [];
            existingBills.push(billData);

            // ब्राउज़र में सेव करना
            localStorage.setItem('allBills', JSON.stringify(existingBills));

            alert("बिल डेटा सफलतापूर्वक सेव हो गया है!");

            // फॉर्म रीसेट करना
            document.getElementById('customerName').value = '';
            document.getElementById('itemName').value = '';
            document.getElementById('quantity').value = '';
            document.getElementById('price').value = '';
            document.getElementById('totalAmount').innerText = '₹0.00';
        }

        // लेफ्ट साइड वाले बटन का एक्शन (यह अब history.html पेज पर ले जाएगा)
        function leftButtonAction() {
            window.location.href = "history.html";
        }
    </script>

</body>
</html>
