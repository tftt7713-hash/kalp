<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill History & Search</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .history-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 500px;
            border: 1px solid #eef2f5;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            font-size: 22px;
        }

        .back-btn {
            background-color: #64748b;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 20px;
            display: inline-block;
        }

        /* सर्च सेक्शन बॉक्स */
        .search-section {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .search-section h3 {
            font-size: 15px;
            color: #475569;
            margin-bottom: 10px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        input {
            flex-grow: 1;
            padding: 10px 12px;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #4f46e5;
        }

        button.search-btn {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        button.search-btn:hover {
            background-color: #4338ca;
        }

        /* रिजल्ट दिखाने के लिए डिज़ाइन (बिना पुराना टेबल स्टाइल के) */
        .result-container {
            margin-top: 25px;
        }

        .result-title {
            font-size: 16px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 12px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 5px;
        }

        .result-item {
            background: #fff;
            border-left: 4px solid #10b981;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 0 8px 8px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            font-size: 15px;
            display: flex;
            justify-content: space-between;
        }

        .result-item .primary-text {
            font-weight: 600;
            color: #334155;
        }

        .result-item .qty-badge {
            background: #e0f2fe;
            color: #0369a1;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
        }

        .no-data {
            text-align: center;
            color: #94a3b8;
            padding: 20px;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="history-card">
        <button class="back-btn" onclick="window.location.href='index.html'">← Back to Billing</button>
        <h2>🔍 Search & History</h2>

        <!-- 1. कस्टमर के नाम से सर्च करने का बॉक्स -->
        <div class="search-section">
            <h3>Search by Customer Name</h3>
            <div class="input-row">
                <input type="text" id="custSearchInput" placeholder="e.g. Dinesh Bhai">
                <button class="search-btn" onclick="searchByCustomer()">Search</button>
            </div>
        </div>

        <!-- 2. आइटम के नाम से सर्च करने का बॉक्स -->
        <div class="search-section">
            <h3>Search by Item Name</h3>
            <div class="input-row">
                <input type="text" id="itemSearchInput" placeholder="e.g. Dashang Dhoop">
                <button class="search-btn" onclick="searchByItem()">Search</button>
            </div>
        </div>

        <!-- परिणाम दिखाने की जगह -->
        <div class="result-container" id="resultContainer" style="display: none;">
            <div class="result-title" id="resultHeading">Results</div>
            <div id="resultsList"></div>
        </div>
    </div>

    <script>
        // Local Storage से सारा डेटा लोड करना
        function getBills() {
            return JSON.parse(localStorage.getItem('allBills')) || [];
        }

        // 1. कस्टमर के हिसाब से सर्च करना
        function searchByCustomer() {
            const query = document.getElementById('custSearchInput').value.trim().toLowerCase();
            const allBills = getBills();
            const listDiv = document.getElementById('resultsList');
            const container = document.getElementById('resultContainer');
            
            if(!query) { alert("कृपया कस्टमर का नाम डालें!"); return; }
            
            // आइटम सर्च का इनपुट साफ़ कर दें
            document.getElementById('itemSearchInput').value = '';
            
            // फिल्टर करना (अगर नाम मैच होता है)
            const filtered = allBills.filter(bill => bill.customerName.toLowerCase().includes(query));
            
            container.style.display = "block";
            document.getElementById('resultHeading').innerText = `Items bought by "${document.getElementById('custSearchInput').value}":`;
            listDiv.innerHTML = "";

            if(filtered.length === 0) {
                listDiv.innerHTML = `<div class="no-data">इस नाम का कोई डेटा नहीं मिला।</div>`;
                return;
            }

            // रिज़ल्ट दिखाना (Item Name और Quantity)
            filtered.forEach(bill => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'result-item';
                itemDiv.innerHTML = `
                    <span class="primary-text">📦 ${bill.itemName}</span>
                    <span class="qty-badge">Qty: ${bill.quantity}</span>
                `;
                listDiv.appendChild(itemDiv);
            });
        }

        // 2. आइटम के हिसाब से सर्च करना
        function searchByItem() {
            const query = document.getElementById('itemSearchInput').value.trim().toLowerCase();
            const allBills = getBills();
            const listDiv = document.getElementById('resultsList');
            const container = document.getElementById('resultContainer');
            
            if(!query) { alert("कृपया आइटम का नाम डालें!"); return; }
            
            // कस्टमर सर्च का इनपुट साफ़ कर दें
            document.getElementById('custSearchInput').value = '';

            // फिल्टर करना (अगर आइटम मैच होता है)
            const filtered = allBills.filter(bill => bill.itemName.toLowerCase().includes(query));
            
            container.style.display = "block";
            document.getElementById('resultHeading').innerText = `Customers who bought "${document.getElementById('itemSearchInput').value}":`;
            listDiv.innerHTML = "";

            if(filtered.length === 0) {
                listDiv.innerHTML = `<div class="no-data">इस आइटम का कोई डेटा नहीं मिला।</div>`;
                return;
            }

            // रिज़ल्ट दिखाना (Customer Name और Quantity)
            filtered.forEach(bill => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'result-item';
                itemDiv.innerHTML = `
                    <span class="primary-text">👤 ${bill.customerName}</span>
                    <span class="qty-badge">Qty: ${bill.quantity}</span>
                `;
                listDiv.appendChild(itemDiv);
            });
        }
    </script>

</body>
</html>
